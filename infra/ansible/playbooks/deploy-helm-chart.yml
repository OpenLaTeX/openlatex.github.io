# deployer k3s sur master
# on rappelle que k3s est installé en cloud init de terraform
# Ce playbook tourne sur le runneret parle directement à l'API k3s avec la kubeconfig recuperee . de ce fait pas besoin de config le ssh / hote

# https://docs.ansible.com/projects/ansible/latest/collections/kubernetes/core/helm_module.html
---
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_namespace: "{{ release_namespace | default('openlatex-dev' )}}"
    # secret de contournement de la limite de compilation, utile pour les tests de charge
    test_bypass_secret: "{{ TEST_BYPASS_SECRET | default(lookup('env', 'TEST_BYPASS_SECRET'), true) }}"
    postgres_password: "{{ POSTGRES_PASSWORD | default(lookup('env', 'POSTGRES_PASSWORD'), true) }}"
    jwt_secret: "{{ JWT_SECRET | default(lookup('env', 'JWT_SECRET'), true) }}"
    jwt_expires_in: "{{ JWT_EXPIRES_IN | default('1h', true) }}"
    b2_s3_endpoint: "{{ lookup('env', 'B2_S3_ENDPOINT') | default('', true) }}"
    b2_bucket_name: "{{ lookup('env', 'B2_BUCKET_NAME') | default('', true) }}"
    b2_region: "{{ lookup('env', 'B2_REGION') | default('', true) }}"
    b2_application_key_id: "{{ lookup('env', 'B2_APPLICATION_KEY_ID') | default('', true) }}"
    b2_application_key: "{{ lookup('env', 'B2_APPLICATION_KEY') | default('', true) }}"
    gpg_passphrase: "{{ lookup('env', 'GPG_PASSPHRASE') | default('changeme', true) }}"
  environment:
    K8S_AUTH_KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') | default('./k3s.yaml', true) }}"
  tasks:
    - name: Taint les nodes control plane pour interdire les workloads compilateur (k3s le fait pas par défaut, ca va bottleneck master sinon)
      kubernetes.core.k8s_taint:
        state: present
        name: "{{ item }}"
        taints:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
      loop: "{{ query('kubernetes.core.k8s', kind='Node', label_selector='node-role.kubernetes.io/control-plane') | map(attribute='metadata.name') | list }}"

    - name: Déployer le helm chart monitoring (prometheus, grafana, kube state metrics)
      kubernetes.core.helm:
        name: kube-state-metrics
        chart_ref: "{{ playbook_dir }}/../../../deploy/kubernetes/charts/monitoring"
        values_files: 
          - "{{ playbook_dir }}/../../../deploy/kubernetes/charts/monitoring/values.yaml"
        release_namespace: "monitoring"
        create_namespace: true
        set_values:
          - value: "namespace=monitoring"
            value_type: "string"
        wait: true
         

    - name: appliquer la config globale traefik (HelmChartConfig sur namespace kube-system)
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../../../deploy/kubernetes/cluster/traefik-k3s-config.yaml"

    - name: Déployer le helm chart openlatex complet(+ injection du secret)
      kubernetes.core.helm:
        name: openlatex-compile
        chart_ref: "{{ playbook_dir }}/../../../deploy/kubernetes/charts/openlatex"
        values_files: 
          # values personnalisées par namespace (dev/prod overrides par-dessus values.yaml)
          - "{{ playbook_dir }}/../../../deploy/kubernetes/charts/openlatex/values.yaml"
          - "{{ playbook_dir }}/../../../deploy/kubernetes/charts/openlatex/values-{{ target_namespace | replace('openlatex-', '') }}.yaml"
        release_namespace: "{{ target_namespace }}"
        create_namespace: true
        values:
          TEST_BYPASS_SECRET: "{{ test_bypass_secret }}"
          POSTGRES_PASSWORD: "{{ postgres_password }}"
          JWT_SECRET: "{{ jwt_secret }}"
          JWT_EXPIRES_IN: "{{ jwt_expires_in }}"
          B2_S3_ENDPOINT: "{{ b2_s3_endpoint }}"
          B2_BUCKET_NAME: "{{ b2_bucket_name }}"
          B2_REGION: "{{ b2_region }}"
          B2_APPLICATION_KEY_ID: "{{ b2_application_key_id }}"
          B2_APPLICATION_KEY: "{{ b2_application_key }}"
          GPG_PASSPHRASE: "{{ gpg_passphrase }}"
          namespace: "{{ target_namespace }}"
        # l'image de compilation est assez lourde donc un délai de pull est à prendre en compte
        timeout: 1800s
        wait: true
      # ne pas montrer les secrets dans les logs CI
      # no_log: true
         
