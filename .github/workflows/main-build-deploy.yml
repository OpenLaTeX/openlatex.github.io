name: (DOCKER/BACKEND) - Construction et déploiement des images spécifiques + test infra
# Les images "account-manager" et "compiler" sont construites en CI et publiées sur GHCR
# pour éviter de consommer les ressources du VPS pendant le build.
# Postgres (build local léger) et Caddy (image publique) ne changent quasiment jamais donc ils sont gérés directement par docker-compose sur le VPS

on:
  push:
    branches: 
      - main 
      - 39*
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  services-to-build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.neo.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: hellofresh/action-changed-files@v3
        id: neo
        with:
          # l action prend tous les fichiers qui ont changé depuis les derniers commits, et compare leur chemin à ces expressions
          # si ca match, ca extrait le ?P<service> comme service ayant changé et l'ajoute au json matrix. Du coup on rebuild les images conteneur que à leur changement
          pattern: (?:backend/(?:compiler/)?)?(?P<service>account-crud-api|collab-websocket|queue-producer|queue-worker|frontend)(?=/)
          default-patterns: |
            backend/shared/**
            backend/package*.json
            backend/compiler/Dockerfile.base

  build-push-changed-container-images:
    needs: [services-to-build, code-test]
    if: ${{ fromJson(needs.services-to-build.outputs.matrix).include[0] || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - container-image: queue-producer
            build-path: backend/compiler/queue-producer
            context: ./backend
          - container-image: queue-worker
            build-path: backend/compiler/queue-worker
            context: ./backend
          - container-image: account-crud-api
            build-path: backend/account-crud-api
            context: ./backend
          - container-image: collab-websocket
            build-path: backend/collab-websocket
            context: ./backend
          - container-image: frontend
            build-path: frontend
            context: ./frontend
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: ${{ matrix.container-image }}
      dockerfile: ${{ matrix.build-path }}/Dockerfile
      context: ${{ matrix.context }}
      # = on le re build ou pas, grace à la detection de chemins precedemment effectuee
      changed: ${{ contains(needs.services-to-build.outputs.matrix, matrix.container-image) || github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  deploy-k3s-helm:
    needs: [build-push-changed-container-images]
    if: always() && !failure() && !cancelled()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Installer ansible et kubernetes.core
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core kubernetes openshift
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy collection install kubernetes.core

      - name: Installer Helm
        uses: azure/setup-helm@v4

      - name: Config SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Récupérer le kubeconfig depuis le master
        run: |
          mkdir -p ${{ github.workspace }}/.kube
          ssh -o StrictHostKeyChecking=no admin@${{ vars.K3S_MASTER_IP }} cat /etc/rancher/k3s/k3s.yaml > ${{ github.workspace }}/.kube/config
          sed -i "s/127.0.0.1/${{ vars.K3S_MASTER_IP }}/g" ${{ github.workspace }}/.kube/config
          chmod 600 ${{ github.workspace }}/.kube/config

      - name: Déployer le helm chart (namespace diff selon la branche)
        env:
          RELEASE_NAMESPACE: ${{ case(github.ref_name == 'main', 'openlatex-prod', 'openlatex-dev') }}
          # secret de contournement de la limite de compilation, utile pour les tests de charge
          TEST_BYPASS_SECRET: ${{ secrets.TEST_BYPASS_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT || vars.B2_S3_ENDPOINT }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME || vars.B2_BUCKET_NAME }}
          B2_REGION: ${{ secrets.B2_REGION || vars.B2_REGION }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: | 
          echo "deploy pour le namespace $RELEASE_NAMESPACE" 
          export KUBECONFIG=${{ github.workspace }}/.kube/config 
          ansible-playbook infra/ansible/playbooks/deploy-helm-chart.yml -e "target_namespace=$RELEASE_NAMESPACE"

  infra-load-tests:
    needs: [deploy-k3s-helm]
    if: always() && !failure() && !cancelled()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Installer k6 (procedure d install donnee sur le site)
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Test de charge (3 personas) pour vérifier que l'infra tient (Environ 250 compilations, devrait se faire en 1 min 30)
        env:
          TEST_BYPASS_SECRET: ${{ secrets.TEST_BYPASS_SECRET }}
        run: |
          cd infra/load-tests/k6 &&
          chmod +x all-personas.sh &&
          bash all-personas.sh Grouped
