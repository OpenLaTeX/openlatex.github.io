{{- range $key, $deployment := .Values.deployments }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ $deployment.name }}
  name: {{ $deployment.name }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $deployment.name }}
  strategy: {}
  template:
    metadata:
      labels:
        app: {{ $deployment.name }}
    spec:
      {{- if $deployment.volumes }}
      volumes:
      {{- toYaml $deployment.volumes | nindent 8 }}
      {{- end }}
      containers:
      - image: {{ $deployment.image }}
        name: {{ $deployment.name }}
        securityContext:
          runAsUser: {{ $deployment.uid | default 10000 }}
          runAsNonRoot: true
        {{- if $deployment.env }}
        env:
        {{- toYaml $deployment.env | nindent 10 }}
        {{- end }}
        {{- if $deployment.resources }}
        resources:
        {{- toYaml $deployment.resources | nindent 10 }}
        {{- end }}
        {{- if $deployment.port }}
        ports:
          - containerPort: {{ $deployment.port }}
        {{- end }}
        {{- if $deployment.volumeMounts }}
        volumeMounts:
        {{- toYaml $deployment.volumeMounts | nindent 10 }}
        {{- end }}

        {{ if or $deployment.postgresRelated $deployment.compileRelated $deployment.grafanaRelated }}
        envFrom:
        {{ if $deployment.postgresRelated }}
          - configMapRef:
              name: latex-postgres-connection
          - secretRef:
              name: latex-postgres-password
        {{ end }}
        {{ if $deployment.compileRelated }}
          - configMapRef:
              name: latex-compile-config
          {{ if $deployment.compileSecret }}
          - secretRef:
              name: latex-compile-secret
          {{ end }}
        {{ end }}
        {{ if $deployment.grafanaRelated }}
          - configMapRef:
              name: latex-grafana-config
        {{ end }}
        {{ end }}
---
{{ if $deployment.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $deployment.name }}-svc
  namespace: {{ $.Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ $deployment.name }}
  ports:
  - port: {{ $deployment.port }}
    targetPort: {{ $deployment.port }}
{{ end }}
---
{{ end }}