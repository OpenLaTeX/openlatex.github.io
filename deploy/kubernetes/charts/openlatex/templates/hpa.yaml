apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler 
metadata:
  name: {{ .Values.deployments.worker.name }}-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.deployments.worker.name }}
  minReplicas: {{ .Values.workerHpa.minReplicas }}
  maxReplicas: {{ .Values.workerHpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 3
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Pods
        value: 2
        periodSeconds: 240
