name: openlatex

services:
  postgres:
    build: ../../backend/postgres
    container_name: openlatex_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlatex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlatex}
      POSTGRES_DB: ${POSTGRES_DB:-openlatex}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openlatex

  pg-bkup:
    image: jkaninda/pg-bkup:latest
    container_name: openlatex_pg_bkup
    restart: unless-stopped
    command: ["backup", "--storage", "${BACKUP_STORAGE:-local}"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pg_bkup_data:/backup
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-openlatex}
      DB_USERNAME: ${POSTGRES_USER:-openlatex}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-openlatex}
      # l'upload S3 est optionnel . Preciser la variable BACKUP_STORAGE=s3
      AWS_S3_ENDPOINT: ${B2_S3_ENDPOINT:-}
      AWS_S3_BUCKET_NAME: ${B2_BUCKET_NAME:-}
      AWS_REGION: ${B2_REGION:-}
      AWS_ACCESS_KEY: ${B2_APPLICATION_KEY_ID:-}
      AWS_SECRET_KEY: ${B2_APPLICATION_KEY:-}
      BACKUP_CRON_EXPRESSION: "${BACKUP_CRON_EXPRESSION:-0 10,15,23 * * *}"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      GPG_PASSPHRASE: ${GPG_PASSPHRASE:?GPG_PASSPHRASE pas present faire ./gen-env.sh}
      TZ: Europe/Paris
    networks:
      - openlatex
  
  frontend:
    build: 
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: openlatex_frontend 
    restart: unless-stopped
    networks:
      - openlatex  

  backend:
    build:
      context: ../../backend
      dockerfile: account-crud-api/Dockerfile
    container_name: openlatex_account-manager
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlatex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlatex}
      POSTGRES_DB: ${POSTGRES_DB:-openlatex}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      PORT: 8000
    networks:
      - openlatex

  caddy:
    image: caddy:2
    container_name: openlatex_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # par défaut, ip d'un node pour ingress kubernetes
      COMPILER_ADDRESS: ${COMPILER_ADDRESS:-172.16.10.52:80}
    volumes:
      - ../../backend/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - openlatex

  collab:
    build:
      context: ../../backend
      dockerfile: collab-websocket/Dockerfile
    container_name: openlatex_collab
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlatex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlatex}
      POSTGRES_DB: ${POSTGRES_DB:-openlatex}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-changeme}
      PORT: 7000
    networks:
      - openlatex

  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: openlatex_prometheus
    restart: unless-stopped
    # on ouvre pour que le réseau privé écrive dedans
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - ../../backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../backend/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-admin-api'
    networks:
      - openlatex

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: openlatex_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openlatex

  grafana:
    image: grafana/grafana-oss:10.4.3
    container_name: openlatex_grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_SERVER_URL:-https://localhost/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    networks:
      - openlatex

volumes:
  caddy_data:
  caddy_config:
  pg_bkup_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  openlatex:
    driver: bridge
